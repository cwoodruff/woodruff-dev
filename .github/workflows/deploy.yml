name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/Christopher_Woodruff_Executive_Resume.pdf'
      - '.github/workflows/deploy.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 'true' deploys to https://cwoodruff.github.io/woodruff-dev/ with a base path
  # (and site/public/CNAME must not exist). 'false' builds for https://woodruff.dev.
  PREVIEW: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          path: ./site
          node-version: 24
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
