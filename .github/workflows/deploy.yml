name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/Christopher_Woodruff_Executive_Resume.pdf'
      - '.github/workflows/deploy.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 'true' deploys to https://cwoodruff.github.io/woodruff-dev/ with a base path
  # (and site/public/CNAME must not exist). 'false' builds for https://woodruff.dev.
  PREVIEW: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          path: ./site
          node-version: 24
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages sometimes stalls in "syncing_files" until deploy-pages gives up
      # (~10 min). The artifact is already uploaded, so a second attempt is cheap.
      - name: Deploy to GitHub Pages
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
      - name: Deploy to GitHub Pages (retry)
        id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
      - name: Resolve page URL
        id: deployment
        run: echo "page_url=${{ steps.retry.outputs.page_url || steps.first.outputs.page_url }}" >> "$GITHUB_OUTPUT"
